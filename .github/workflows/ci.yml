name: CI Pipeline - Cyber Arcade Leaderboard

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  pipeline:
    name: Build, Lint, Test & Security Scans
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pytest-cov pip-audit bandit

      - name: Run Linter (Ruff)
        run: ruff check . --exit-zero

      - name: Run Tests (Pytest)
        run: pytest -q

      - name: Run SAST Analysis (Bandit)
        run: bandit -r app/ -q

      - name: Audit Dependencies (pip-audit)
        run: pip-audit || true

      # --- SCAN TRIVY DE L'IMAGE DOCKER ---
      - name: Build Docker Image for Scan
        run: docker build -t arcade-api:test .

      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'arcade-api:test'
          format: 'table'
          exit-code: '0' # Utiliser '1' si tu veux bloquer la CI sur CVE critique
          severity: 'CRITICAL,HIGH'