services:
  api:
    build:
      context: .
      target: runner
    container_name: arcade-api
    restart: always
    environment:
      - DB_PATH=/app/data/scores.db
    volumes:
      - sqlite_data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3

volumes:
  sqlite_data: